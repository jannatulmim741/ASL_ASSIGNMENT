<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
  </head>
  <body>
    <header>
        <!-- Nav Bar Section -->
      <section class="px-10 py-5 bg-white">
        <nav
          class="flex justify-between items-center border border-[#FFFFFF]  py-4 mb-8"
        >
        <h1 class="text-2xl font-bold text-nowrap">Book Vibe</h1>
        
          <ul class="hidden md:flex items-center gap-6">
            <li class="border border-[#23BE0A] text-[#23BE0A] px-5 py-2.5 rounded-lg font-semibold">Home</li>
            <li>Listed Books</li>
            <li>Pages to read</li>
          </ul>
          <div class="space-x-5">
            <button class="bg-[#23BE0A] px-5 py-2.5 rounded-lg text-[14px] font-semibold text-white ">Sign In</button>
            <button
              class="bg-[#59C6D2] px-5 py-2.5 rounded-lg text-[14px] font-semibold text-white"
            >
              Sign Up
            </button>
          </div>
        </nav>
         <!-- Hero Section -->
      <section class="flex items-center justify-between bg-gray-100 rounded-2xl px-10 py-5">
        <div >
          <h3 class="font-extrabold text-3xl mb-6">
            Books to freshen up <br/>your bookshelf
          </h3>
          <div class="space-x-3 mt-10">
            <button class="bg-[#23BE0A] px-5 py-2.5 rounded-lg text-[14px] text-white">
              view the list
            </button>
          </div>

        </div>
        <div>
            <img src="./assets/Banner.png" alt="">
        </div>
      </section>
    </header>
    <main></main>
    <footer></footer>
  </body>
</html>
